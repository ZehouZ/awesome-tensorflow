name: Update inflation nowcast

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  nowcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r nowcasting/requirements.txt
      - name: Run nowcast update
        run: python nowcasting/inflation_nowcast.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly_inflation_nowcast.csv data/model_metrics.json
          git diff --cached --quiet || git commit -m "chore(nowcast): automated data refresh"
      - name: Push changes
        run: git push
